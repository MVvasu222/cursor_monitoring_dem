<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Server Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') if session.user else url_for('login') }}">Server Monitor</a>
    {% if session.user %}
    <nav class="nav">
      <a class="nav-link{% if request.endpoint == 'dashboard' %} is-active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
      <a class="nav-link{% if request.endpoint == 'server_list' %} is-active{% endif %}" href="{{ url_for('server_list') }}">Server</a>
      <a class="nav-link{% if request.endpoint == 'history' %} is-active{% endif %}" href="{{ url_for('history') }}">History</a>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="nav-link nav-button" type="submit">Sign out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="stage">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
